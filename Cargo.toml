[package]
name = "irodori-extension-starrocks"
version = "0.1.0"
publish = false
edition = "2021"
license = "0BSD"
description = "Native Irodori Table connector extension for StarRocks."
repository = "https://github.com/irodori-table/irodori-extension-starrocks"
readme = "README.md"
include = [
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE-*",
  "connector.config.json",
  "connector.source.json",
  "irodori.extension.json",
  "src/**",
]

[lib]
name = "irodori_extension_starrocks"
crate-type = ["cdylib", "rlib"]

[dependencies]
irodori-connector-abi = { git = "https://github.com/irodori-table/irodori-kit", tag = "v0.9.1" }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
serde_json = "1"

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
